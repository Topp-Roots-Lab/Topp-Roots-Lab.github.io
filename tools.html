---
layout: page
title: Tools & resources
permalink: /tools.html
lede: Root phenotyping software from the lab, free to download from GitHub.
wide: true
---
<ul class="tool-list">
  {% for tool in site.data.tools %}
  <li class="tool">
    <div>
      <h2>{{ tool.name }}</h2>
      <p>{{ tool.text }}</p>
      <p><a class="button button--dark" href="{{ tool.url }}">View on GitHub<span class="visually-hidden">: {{ tool.name }}</span></a></p>
    </div>
    <a class="tool__image" href="{{ tool.url }}" tabindex="-1" aria-hidden="true"><img src="{{ '/images/' | append: tool.image | relative_url }}" alt="" loading="lazy"></a>
  </li>
  {% endfor %}
</ul>
