<ul class="pub-list">
  {% for d in site.data.datasets %}
  <li class="pub">
    <p class="pub__title">{{ d.title }}</p>
    <p class="pub__authors">{{ d.text }}</p>
    <p class="pub__venue"><a href="{{ d.url }}">{{ d.url }}</a></p>
  </li>
  {% endfor %}
</ul>
