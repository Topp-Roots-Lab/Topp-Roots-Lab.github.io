# Research approaches, shown on the home page and the Research page.
# Leave `url` out for an approach that has no page of its own yet.
- title: Root Genetics
  image: root-genetics.png
  text: >-
    By comparing different genotypes bred or naturally selected for various growth traits and using
    molecular analysis, we aim to identify genes that can help generate more stress-resistant and
    sustainable crops.
- title: X-ray CT
  image: xray-root.png
  url: /XRT.html
  text: >-
    The Topp lab is one of the few X-ray imaging facilities in the world dedicated exclusively to
    studying plant biology and plant-soil-microbe interactions. X-ray imaging is a non-destructive
    method for generating 3D volume data of large, delicate, and challenging plant and soil samples.
    We have two complementary X-ray instruments that can image samples ranging from one meter tall
    down to hundreds of nanometers, at various resolutions depending on size and density.
- title: X-ray Microscopy
  image: xray-microscope-root.png
  url: /XRM.html
  text: >-
    The success of the Xray instrument soon led to acquiring a smaller, but more powerful X-ray
    microscope to look at root-microbial interactions. Now the Topp lab can see the 3D subterranean
    world of roots nondestructively, at least for plants growing in large containers. The Topp lab’s
    X-ray CT and microscope facility for plant science at the Danforth Center is unique in the world.
- title: Modern Mesocosms
  image: modern-mesocosm.png
  text: >-
    Mesocosms provide unconstrained root growth, excavation and preservation of 3-dimensional root
    system architecture (RSA), and modularity that facilitates the use of various sensors.
