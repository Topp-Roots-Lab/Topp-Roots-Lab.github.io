- name: 3-D Root Crown Analysis Pipeline
  text: Pipeline for segmentation of root crowns excavated from field and imaged using Xray CT
  url: https://github.com/Topp-Roots-Lab/3d-root-crown-analysis-pipeline
  image: 3d-root-crown-analysis-pipeline.png
- name: Gia3D
  menu_name: GiaRoots
  text: Root3D skeleton trait extraction
  url: https://github.com/Topp-Roots-Lab/Gia3D
  image: Gia3D.png
