- title: Zea mays 2D DIRT images 2016
  text: "This data set consists of photographs (2-D images) of root crowns of Zea mays, of the Illinois Protein Strain Recombinant Inbred (IPSRI) population. This data set can be used to analyze the visible traits of root crowns. Christopher Topp (2019). CyVerse Data Commons. DOI 10.25739/825e-md33"
  url: https://doi.org/10.25739/825e-md33
- title: Zea mays gels 3D volumes 2016
  text: "This data set consists of 3-D volumes that represent Zea mays root crowns, of the Illinois Protein Strain Recombinant Inbred (IPSRI) population. This data set can be used to analyze root system architectures using 3-D positional information. Christopher Topp (2019). CyVerse Data Commons. DOI 10.25739/ey8q-6g89."
  url: https://doi.org/10.25739/ey8q-6g89
- title: Zea mays Xray volumes 2016
  text: "This data set consists of 3-D volumes generated by x-ray scans that represent Zea mays root crowns of the Illinois Protein Strain Recombinant Inbred (IPSRI) population. These are not reconstructions of the root system architectures (RSA) but voxel representations of an RSA within a given volume. This data set can be used to develop and test segmentation tools for analyzing RSAs in 3-D space. Christopher Topp (2019). CyVerse Data Commons. DOI 10.25739/4ybe-ec20."
  url: https://doi.org/10.25739/4ybe-ec20
