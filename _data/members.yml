# (The PI is written directly in lab.html.)
#
# To add someone, copy a block and edit it:
#   name:   full name (required)
#   pronouns: e.g. "she/her" — only if the person gave them (optional)
#   role:   job title (required)
#   joined: year or "August 2023" (optional)
#   blurb:  one or two sentences on what they do (optional)
#   photo:  file name inside images/headshots/ (optional — initials are shown without it)
#   email:  shown publicly, written as "name at msu.edu" — only add it if the person wants it listed (optional)
#   link:   profile page such as /profile/sourabh-palande.html, or an outside website (optional)
#   link_label: text for that link, e.g. "Bio" or "Website"
#
# When someone leaves, move them to _data/alumni.yml.

